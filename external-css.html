<!DOCTYPE html>
<html>


<head>
    <title>Meine erste Webseite mit CSS</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <h1>Willkommen auf meiner Webseite</h1>
    <h1>Das ist eine Beispielseite für die Nutzung von CSS</h1>

    <!-- Ein div Element ist ein Container für andere HTML Elemente -->
    <div class="box">
        Hallo, ich bin eine Box!

    </div>
    <!-- Eine weitere Möglichkeit CSS zu verwenden ist Inline CSS wobei das CSS direkt dem Element zugewiesen wird -->
    <p style="color:blue">
        Dies ist meine erste selbst erstellte HTML-Seite.
    </p>
    <p>
        Dies ist meine erste selbst erstellte 
        HTML-Seite.
    </p>

    <p>
        Ich besuche den
        <a href="https://www.leifheit-campus.de/">Leifheit Campus</a>.
    </p>

</body>

</html>
